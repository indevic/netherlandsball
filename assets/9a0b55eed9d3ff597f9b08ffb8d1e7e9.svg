<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="530.9625" height="339.99964" viewBox="0,0,530.9625,339.99964"><g transform="translate(-107.39081,8.79393)"><g fill="#000000" stroke="none" stroke-miterlimit="10" font-family="Sans Serif" font-weight="400" font-size="40"><text transform="translate(107.55442,10.11188) scale(0.32722,0.32722)" font-size="40" xml:space="preserve" fill="#000000"><tspan x="0" dy="0">Indevic thanks you for playing</tspan><tspan x="0" dy="46.15px">Netherlandsball: United Provinces!</tspan><tspan x="0" dy="46.15px">This game is a fictional, lighthearted</tspan><tspan x="0" dy="46.15px">grand strategy experience  inspired by</tspan><tspan x="0" dy="46.15px">projects such as games by SHN Games,</tspan><tspan x="0" dy="46.15px">Risk, and Hearts of Iron IV. In this</tspan><tspan x="0" dy="46.15px">alternate history, the Netherlands</tspan><tspan x="0" dy="46.15px">faces a collapse in 1986, where its</tspan><tspan x="0" dy="46.15px">provinces break away into separate</tspan><tspan x="0" dy="46.15px">states, each with a goal of reuniting the</tspan><tspan x="0" dy="46.15px">nation. Please note that all events and</tspan><tspan x="0" dy="46.15px">outcomes within this game are entirely</tspan><tspan x="0" dy="46.15px">fictional and should not be taken as a</tspan><tspan x="0" dy="46.15px">reflection of real history. This is just an</tspan><tspan x="0" dy="46.15px">exploration of an imagined scenario as</tspan><tspan x="0" dy="46.15px">a tribute to my Country. All music and</tspan><tspan x="0" dy="46.15px">additional art assets used within the</tspan><tspan x="0" dy="46.15px">game are sourced from copyright-free</tspan><tspan x="0" dy="46.15px">material, ensuring a legally sound and</tspan><tspan x="0" dy="46.15px">enjoyable experience for everyone!</tspan><tspan x="0" dy="46.15px">~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~</tspan><tspan x="0" dy="46.15px">Have fun re-uniting the Netherlands!</tspan></text><text transform="translate(455.28455,19.87057) scale(0.68898,0.66452)" font-size="40" xml:space="preserve" fill="#000000"><tspan x="0" dy="0">𝐂𝐫𝐞𝐝𝐢𝐭𝐬:</tspan></text><text transform="translate(383.30782,41.10137) scale(0.32722,0.32722)" font-size="40" xml:space="preserve" fill="#000000"><tspan x="0" dy="0">~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~</tspan><tspan x="0" dy="46.15px">Developing and Programming: @Indevic</tspan><tspan x="0" dy="46.15px">~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~</tspan><tspan x="0" dy="46.15px">Art: @Indevic, who created a bunch :D</tspan><tspan x="0" dy="46.15px">@WitheredRose (Indevic's gf, whos art is</tspan><tspan x="0" dy="46.15px">not yet in the game but will be soon!)</tspan><tspan x="0" dy="46.15px">@IsoMapper who redesigned the</tspan><tspan x="0" dy="46.15px">thumbnails for the game's Page</tspan><tspan x="0" dy="46.15px">Indevic's ex-gf who made the hats</tspan><tspan x="0" dy="46.15px">~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~</tspan><tspan x="0" dy="46.15px">Composers: StanXSam &amp; StaSik (who</tspan><tspan x="0" dy="46.15px">created the Upgrade menu theme by</tspan><tspan x="0" dy="46.15px">remixing a copyright free soundtrack!)</tspan><tspan x="0" dy="46.15px">~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~</tspan><tspan x="0" dy="46.15px">Honourable Mention: @Flexible_Chaos</tspan><tspan x="0" dy="46.15px">for the sheer amount of attention he</tspan><tspan x="0" dy="46.15px">has given to the project &lt;3</tspan></text></g></g></svg>